<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Geist;font-weight:500;src:url(../../film/assets/fonts/geist-500.woff2)}@font-face{font-family:Geist;font-weight:700;src:url(../../film/assets/fonts/geist-700.woff2)}@font-face{font-family:Geist;font-weight:800;src:url(../../film/assets/fonts/geist-800.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
body{width:700px;height:500px;font-family:Geist,sans-serif;background:#f6f5fb;color:#17162a;overflow:hidden}
.top{height:54px;background:#fff;border-bottom:2px solid #e7e4f2;display:flex;align-items:center;padding:0 22px;gap:12px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#6d28d9);display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.name{font-weight:800;font-size:22px}.name b{color:#7c3aed}
.pill{margin-left:auto;background:#ede9fe;color:#6d28d9;font-weight:700;font-size:15px;padding:7px 14px;border-radius:99px}
.main{padding:22px}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
.sub{color:#5d5a75;font-size:16px;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stat{background:#fff;border-radius:14px;padding:12px 14px;border:2px solid #e7e4f2}
.stat p{font-size:14px;color:#8b88a3}.stat b{font-size:30px}
.task{margin-top:16px;background:#fff;border:2px solid #e7e4f2;border-radius:16px;padding:14px 16px}
.row{display:flex;justify-content:space-between;align-items:center}
.c{color:#7c3aed;font-weight:700;font-size:14px}.t{font-weight:800;font-size:20px}
.hi{background:#fee2e2;color:#dc2626;font-weight:800;font-size:14px;padding:5px 12px;border-radius:99px}
.bar{height:10px;background:#ede9fe;border-radius:9px;margin-top:10px}.bar i{display:block;height:100%;width:62%;border-radius:9px;background:linear-gradient(90deg,#8b5cf6,#6d28d9)}
.tip{margin-top:14px;background:#ede9fe;border-radius:14px;padding:12px 16px;font-size:16px;color:#4c1d95;font-weight:600}
</style></head><body>
<div class="top"><img src="../../film/assets/brand/mark.svg" style="width:34px;height:34px"><div class="name">AI <b>Hub</b></div><div class="pill">AI sorted 5 tasks</div></div>
<div class="main"><h1>Welcome back </h1><p class="sub">Here's what matters today.</p>
<div class="stats"><div class="stat"><p>Due</p><b>3</b></div><div class="stat"><p>High</p><b>1</b></div><div class="stat"><p>Upcoming</p><b>6</b></div><div class="stat"><p>Done</p><b>12</b></div></div>
<div class="task"><div class="row"><div><p class="c">Database Systems</p><p class="t">ERD Design Project</p></div><span class="hi">High</span></div><div class="bar"><i></i></div></div>
<div class="tip">Study Calculus 45 min today — set 3 is due Thursday.</div>
</div></body></html>
