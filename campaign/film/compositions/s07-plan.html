      <div id="s07-plan-cam" class="s07-plan-layer">
        <div id="s07-plan-dots" class="s07-plan-w s07-plan-dots kit-dots"></div>
        <div id="s07-plan-card" class="s07-plan-w s07-plan-card kit-app">
          <div class="kit-zoom" style="--z:1.6"><div class="s07-plan-in">
            <div class="s07-plan-a" style="left:24px; top:22px"><p class="s07-plan-t">Study planner</p><p class="s07-plan-st">Week of Mar 2 · evenings, 5–10 PM</p></div>
            <span id="s07-plan-gen" class="kit-btn gradient s07-plan-a" style="left:634px; top:18px"><svg viewBox="0 0 256 256"><path d="M208,28H188V24a12,12,0,0,0-24,0v4H92V24a12,12,0,0,0-24,0v4H48A20,20,0,0,0,28,48V208a20,20,0,0,0,20,20H208a20,20,0,0,0,20-20V48A20,20,0,0,0,208,28ZM68,52a12,12,0,0,0,24,0h72a12,12,0,0,0,24,0h16V76H52V52ZM52,204V100H204V204Zm112-52a12,12,0,0,1-12,12H140v12a12,12,0,0,1-24,0V164H104a12,12,0,0,1,0-24h12V128a12,12,0,0,1,24,0v12h12A12,12,0,0,1,164,152Z"/></svg>AI Plan My Week</span>

<script>
(function () {
  var P = 's07-plan-';
  var $ = function (id) { return '#' + P + id; };
  var D = 5, B = 0.625;
  var tl = gsap.timeline({ paused: true });

  // build the week grid (Mon 2 .. Sun 8), 5-10 PM, 63px per hour
  var days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var grid = document.getElementById(P + 'grid');
  var CW = 114.6, X0 = 24, Y0 = 104, HR = 63;
  days.forEach(function (d, i) {
    var col = document.createElement('div');
    col.className = 's07-plan-a s07-plan-col';
    col.style.left = (X0 + i * CW) + 'px';
    var hrs = '';
    for (var h = 1; h < 5; h++) hrs += '<i class="s07-plan-hr" style="top:' + (h * HR) + 'px"></i>';
    col.innerHTML = '<p class="s07-plan-ch"><b>' + d + '</b> ' + (2 + i) + '</p><div class="s07-plan-cb">' + hrs + '</div>';
    grid.appendChild(col);
  });
  // [day, start hour, end hour, title, time, bg, ink]
  var blocks = [
    [0, 18, 18.75, 'Calculus review', '6:00–6:45', '#dbeafe', '#1d4ed8'],
    [0, 19, 20.25, 'ERD project', '7:00–8:15', '#ede9fe', '#5b21b6'],
    [1, 18.5, 19.25, 'Physics reading', '6:30–7:15', '#ccfbf1', '#0f766e'],
    [2, 18, 19, 'Quiz 4 prep', '6:00–7:00', '#dbeafe', '#1d4ed8'],
    [3, 19, 20, 'Essay outline', '7:00–8:00', '#ffedd5', '#c2410c'],
    [5, 17.5, 18.5, 'Weekly review', '5:30–6:30', '#ede9fe', '#5b21b6']
  ];
  blocks.forEach(function (b, i) {
    var el = document.createElement('div');
    el.id = P + 'k' + i;
    el.className = 's07-plan-blk';
    el.style.left = (X0 + b[0] * CW + 3) + 'px';
    el.style.top = (Y0 + (b[1] - 17) * HR + 2) + 'px';
    el.style.height = ((b[2] - b[1]) * HR - 4) + 'px';
    el.style.background = b[5]; el.style.color = b[6];
    el.innerHTML = '<p>' + b[3] + '</p><span>' + b[4] + '</span>';
    grid.appendChild(el);
  });

  var CX = 190, CY = 0, Z = 1.6;
  var W = function (ax, ay) { return { x: CX - 680 + ax * Z, y: CY - 400 + ay * Z }; };
  gsap.set($('dots'), { xPercent: -50, yPercent: -50, z: -700, force3D: true });
  gsap.set($('card'), { xPercent: -50, yPercent: -50, x: CX, y: CY, z: 0, force3D: true });
  gsap.set($('kid'), { xPercent: -50, yPercent: -50, x: -720, y: 170, z: 180, force3D: true });
  gsap.set($('ring'), { xPercent: -50, yPercent: -50, z: 2, opacity: 0 });
  gsap.set($('cursor'), { z: 3, opacity: 0 });

  tl.fromTo($('drift'), { scale: 1, rotationY: -1 }, { scale: 1.025, rotationY: 1, duration: D, ease: 'sine.inOut', force3D: true }, 0);
  tl.fromTo($('cam'), { x: 3000, rotationY: -8 }, { x: 0, rotationY: -2, duration: 0.65, ease: 'expo.out', force3D: true }, 0.07);
  tl.fromTo($('cam'), { rotationY: -2, rotationX: 0, z: 0 }, { rotationY: 3, rotationX: 3, z: 50, duration: 4.2, ease: 'sine.inOut', force3D: true, immediateRender: false }, 0.72);

  // b1: "AI Plan My Week"
  var g = W(634 + 93, 18 + 19);
  tl.fromTo($('cursor'), { x: g.x + 220, y: g.y + 260, opacity: 0 }, { x: g.x, y: g.y, opacity: 1, duration: 0.5, ease: 'power3.out' }, 0.25);
  tl.fromTo($('cursor'), { scale: 1 }, { keyframes: [{ scale: 0.85, duration: 0.1, ease: 'power1.in' }, { scale: 1, duration: 0.45, ease: 'back.out(2)' }], immediateRender: false }, B - 0.1);
  tl.fromTo($('ring'), { x: g.x, y: g.y, scale: 0.4, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, B);
  tl.fromTo($('gen'), { scale: 1 }, { keyframes: [{ scale: 0.95, duration: 0.1 }, { scale: 1, duration: 0.35, ease: 'back.out(2)' }] }, B - 0.05);

  // blocks snap in on half beats b2..b4.5
  blocks.forEach(function (b, i) {
    tl.fromTo($('k' + i), { opacity: 0, scale: 0.4, y: -26 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: 'back.out(2)', transformOrigin: '50% 50%' }, (2 + i * 0.5) * B - 0.06);
  });

  // b5: confirm row; b6: click confirm -> added
  tl.fromTo([$('dis'), $('cf')], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out', stagger: 0.06 }, 5 * B - 0.1);
  var c = W(552 + 137, 440 + 19);
  tl.fromTo($('cursor'), { x: g.x, y: g.y }, { x: c.x, y: c.y, duration: 0.8, ease: 'power3.inOut', immediateRender: false }, 6 * B - 0.9);
  tl.fromTo($('cursor'), { scale: 1 }, { keyframes: [{ scale: 0.85, duration: 0.1, ease: 'power1.in' }, { scale: 1, duration: 0.45, ease: 'back.out(2)' }], immediateRender: false }, 6 * B - 0.1);
  tl.fromTo($('ring'), { x: c.x, y: c.y, scale: 0.4, opacity: 0.9 }, { scale: 1.6, opacity: 0, duration: 0.5, ease: 'power2.out', immediateRender: false }, 6 * B);
  tl.fromTo($('done'), { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(2)' }, 6 * B + 0.04);
  tl.fromTo($('cf'), { opacity: 1 }, { opacity: 0, duration: 0.1, ease: 'power1.inOut', immediateRender: false }, 6 * B + 0.06);

  // the student strolls in, checking his phone
  tl.fromTo($('kid'), { x: -1250 }, { x: -720, duration: 1.6, ease: 'power2.out', force3D: true }, 0.2);
  tl.fromTo($('kid'), { y: 170, rotationZ: -2 }, { y: 154, rotationZ: 2, duration: B / 2, ease: 'sine.inOut', yoyo: true, repeat: 6, immediateRender: false }, 0.2);

  // b3: label
  tl.fromTo($('chip'), { opacity: 0, y: -24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: 'back.out(1.8)' }, 3 * B - 0.05);

  // whip out from b7
  tl.fromTo($('stage'), { x: 0 }, { x: -3000, duration: 0.55, ease: 'expo.in', immediateRender: false }, 7 * B - 0.02);
  tl.fromTo($('label'), { x: 0 }, { x: -3000, duration: 0.5, ease: 'expo.in', immediateRender: false }, 7 * B + 0.02);

  window.__timelines = window.__timelines || {};
  window.__timelines['s07-plan'] = tl;
})();
</script>
